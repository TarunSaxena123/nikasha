[project]
name = "nikasha-extractor"
version = "1.0.0"
description = "Nikasha extraction function: reads a strategy document into rule items and questions (the only LLM use)."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.14",
  "pydantic>=2.7",
  "pypdf>=5",
  "python-docx>=1.1",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "nikasha-log",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27", "jsonschema>=4.22", "referencing>=0.35", "pyyaml>=6", "types-PyYAML", "reportlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nikasha_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "TID"]
# Long lines are data tables and fixed messages; the formatter wraps everything it can.
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use nikasha_log only (feature 07: no user content in logs)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["nikasha_extractor", "nikasha_log", "helpers"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../pylib/nikasha_log"
